  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

EA;\n    --cream:#F4EDE1;\n    --cream-2:#FAF5EC;\n    --ink:#0B0907;\n    --stone:#8A8078;\n    --stone-soft:#C9C1B6;\n    --white:#FFFFFF;\n    --yellow:#FFC42A;\n    --blue:#4A8FE7;\n    --green:#22C55E;\n    --amber:#F59E0B;\n    --red:#E84A3F;\n    --line:rgba(11,9,7,.08);\n    --line-strong:rgba(11,9,7,.16);\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{background:var(--cream);color:var(--ink);font-family:'IBM Plex Sans Arabic','Inter',sans-serif;-webkit-font-smoothing:antialiased}\n  body{overflow-x:hidden}\n  a{color:inherit;text-decoration:none}\n  button{font-family:inherit;cursor:pointer;border:none}\n  .mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:-.01em}\n\n  .page{max-width:1440px;margin:0 auto;padding:0 56px}\n\n  /* ============ TOPBAR ============ */\n  .topbar{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:20px 0;position:sticky;top:0;background:var(--cream);z-index:50;\n    border-bottom:1px solid var(--line);\n  }\n  .logo-wrap{display:inline-flex;align-items:center;gap:9px;text-decoration:none}\n  .logo-mini{height:34px;width:auto;display:block}\n  .logo-footer{height:54px;width:auto;display:block}\n  .topbar nav{display:flex;gap:28px}\n  .topbar nav a{font-size:14px;font-weight:500;color:var(--ink);opacity:.7;transition:opacity .2s}\n  .topbar nav a:hover{opacity:1;color:var(--orange)}\n  .topbar nav a.active{opacity:1;color:var(--orange)}\n  .topbar .right{display:flex;gap:10px;align-items:center}\n  .btn{\n    display:inline-flex;align-items:center;gap:8px;\n    padding:11px 18px;font-size:13px;font-weight:500;border-radius:100px;\n    transition:all .2s;letter-spacing:-.005em;\n  }\n  .btn-ghost{background:transparent;color:var(--ink)}\n  .btn-ghost:hover{background:var(--white)}\n  .btn-primary{background:var(--ink);color:var(--cream)}\n  .btn-primary:hover{background:var(--orange)}\n  .btn-primary .arrow{display:inline-block;transition:transform .2s}\n  .btn-primary:hover .arrow{transform:translateX(-3px)}\n  .btn-orange{background:var(--orange);color:var(--white)}\n  .btn-orange:hover{background:var(--ink)}\n\n  /* ============ HERO ============ */\n  .hero{padding:80px 0 40px;position:relative}\n  .hero-inner{max-width:900px}\n  .hero .badge{\n    display:inline-flex;align-items:center;gap:10px;\n    padding:7px 16px 7px 12px;background:var(--white);border:1px solid var(--line);\n    border-radius:100px;font-size:13px;font-weight:500;margin-bottom:28px;\n  }\n  .hero .badge .d{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 2s ease-out infinite}\n  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(254,60,1,.5)}70%{box-shadow:0 0 0 8px rgba(254,60,1,0)}100%{box-shadow:0 0 0 0 rgba(254,60,1,0)}}\n\n  .hero h1{\n    font-size:clamp(72px,9vw,140px);font-weight:700;letter-spacing:-.045em;line-height:.92;color:var(--ink);\n  }\n  .hero h1 .dot-end{color:var(--orange)}\n  .hero .sub{\n    font-size:18px;color:var(--stone);max-width:46ch;margin-top:24px;line-height:1.5;font-weight:400;\n  }\n\n  /* hero side stats */\n  .hero-stats{\n    background:linear-gradient(180deg, var(--peach-light) 0%, var(--peach) 100%);\n    border-radius:24px;padding:24px;border:1px solid rgba(254,60,1,.08);\n    display:flex;flex-direction:column;gap:14px;\n    position:relative;\n  }\n  .hero-stats .row{\n    display:flex;justify-content:space-between;align-items:baseline;\n    padding-bottom:14px;border-bottom:1px solid rgba(11,9,7,.08);\n  }\n  .hero-stats .row:last-child{border-bottom:none;padding-bottom:0}\n  .hero-stats .k{font-size:12px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.06em}\n  .hero-stats .v{font-size:32px;font-weight:700;color:var(--ink);letter-spacing:-.025em;line-height:1}\n  .hero-stats .v.o{color:var(--orange)}\n  .hero-stats .live-dot{\n    position:absolute;top:18px;right:18px;\n    display:inline-flex;align-items:center;gap:6px;\n    background:var(--white);border-radius:100px;padding:4px 9px 4px 7px;\n    font-size:10px;font-weight:700;color:var(--green);\n    text-transform:uppercase;letter-spacing:.08em;\n    box-shadow:0 4px 10px -4px rgba(11,9,7,.1);\n  }\n  .hero-stats .live-dot span{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-out infinite}\n\n  /* floating chips above hero */\n  .hero-chips{position:absolute;inset:0;pointer-events:none;overflow:hidden}\n  .hero-chips .ico{position:absolute;animation:bob 5s ease-in-out infinite}\n  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0))}50%{transform:translateY(-6px) rotate(var(--r,0))}}\n\n  .ico{\n    display:inline-flex;align-items:center;gap:7px;\n    background:var(--white);border-radius:100px;padding:6px 13px 6px 8px;\n    font-size:12px;font-weight:600;color:var(--ink);\n    box-shadow:0 8px 18px -8px rgba(11,9,7,.18);\n    white-space:nowrap;\n  }\n  .ico .dot{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--white);font-size:10px;font-weight:700}\n  .ico.solid{background:var(--ink);color:var(--white)}\n  .ico.orange{background:var(--orange);color:var(--white)}\n\n  /* ============ HOW IT WORKS ============ */\n  section{padding:64px 0;position:relative}\n  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:36px;gap:48px}\n  .sec-head .num{\n    font-size:13px;font-weight:600;color:var(--orange);\n    background:var(--orange-soft);padding:6px 14px;border-radius:100px;\n    display:inline-block;margin-bottom:18px;\n  }\n  .sec-head h2{\n    font-size:clamp(44px,5vw,72px);font-weight:700;letter-spacing:-.035em;line-height:.95;color:var(--ink);\n  }\n  .sec-head h2 .dot-end{color:var(--orange)}\n  .sec-head .summary{font-size:14px;color:var(--stone);max-width:34ch;line-height:1.5;text-align:left}\n\n  .how-cards{display:grid;grid-template-columns:1fr 1fr;gap:20px}\n  .how-card{\n    background:linear-gradient(180deg, var(--peach-light) 0%, var(--peach) 100%);\n    border-radius:24px;padding:32px;border:1px solid rgba(254,60,1,.08);\n    display:flex;flex-direction:column;gap:14px;min-height:260px;\n    position:relative;overflow:hidden;\n    transition:transform .3s, box-shadow .3s;\n  }\n  .how-card:hover{transform:translateY(-3px);box-shadow:0 24px 48px -24px rgba(254,60,1,.18)}\n  .how-card .role-tag{\n    display:inline-flex;align-items:center;gap:7px;\n    align-self:flex-start;\n    background:var(--white);border-radius:100px;padding:6px 13px 6px 8px;\n    font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;\n  }\n  .how-card .role-tag .d{width:7px;height:7px;border-radius:50%;background:var(--orange)}\n  .how-card h3{\n    font-size:36px;font-weight:700;letter-spacing:-.03em;line-height:.95;margin-top:6px;\n  }\n  .how-card p{font-size:15px;color:var(--stone);line-height:1.55;max-width:36ch}\n  .how-card .cta-row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}\n  .how-card .cta-link{\n    display:inline-flex;align-items:center;gap:8px;\n    background:var(--ink);color:var(--white);padding:11px 18px;border-radius:100px;\n    font-size:13px;font-weight:600;\n    transition:background .2s;\n  }\n  .how-card .cta-link:hover{background:var(--orange)}\n  .how-card.alt .cta-link{background:var(--orange)}\n  .how-card.alt .cta-link:hover{background:var(--ink)}\n  .how-card .arrow{display:inline-block;transition:transform .2s}\n  .how-card .cta-link:hover .arrow{transform:translateX(-3px)}\n  .how-card .corner-ico{\n    position:absolute;top:24px;right:24px;\n    width:48px;height:48px;border-radius:14px;\n    background:var(--white);\n    display:flex;align-items:center;justify-content:center;color:var(--orange);\n    box-shadow:0 8px 18px -8px rgba(11,9,7,.14);\n  }\n  .how-card .corner-ico svg{width:22px;height:22px}\n\n  /* ============ FILTERS ============ */\n  .filter-bar{\n    background:var(--white);border:1px solid var(--line);\n    border-radius:100px;padding:8px;\n    display:flex;align-items:center;gap:8px;flex-wrap:wrap;\n    box-shadow:0 8px 24px -16px rgba(11,9,7,.08);\n  }\n  .filter-bar .left{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex:1}\n  .filter-bar .right{display:flex;align-items:center;gap:8px}\n\n  .pill{\n    display:inline-flex;align-items:center;gap:8px;\n    padding:9px 16px;border-radius:100px;\n    font-size:13px;font-weight:500;color:var(--ink);background:transparent;\n    border:none;cursor:pointer;\n    transition:background .2s;white-space:nowrap;\n  }\n  .pill:hover{background:var(--cream-2)}\n  .pill.active{background:var(--ink);color:var(--cream)}\n  .pill .count{\n    background:var(--orange);color:var(--white);font-size:10px;font-weight:700;\n    padding:2px 7px;border-radius:100px;letter-spacing:.02em;\n  }\n  .pill.active .count{background:var(--cream);color:var(--ink)}\n  .pill .caret{opacity:.5;font-size:10px}\n\n  .search-wrap{\n    position:relative;display:flex;align-items:center;\n    background:var(--cream);border-radius:100px;padding:0 38px 0 16px;\n    min-width:240px;\n  }\n  .search-wrap svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:14px;height:14px;color:var(--stone);}\n  .search-wrap input{\n    background:transparent;border:none;outline:none;\n    font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);\n    padding:11px 0;width:100%;\n  }\n  .search-wrap input::placeholder{color:var(--stone)}\n\n  .sort-wrap{\n    position:relative;background:var(--cream);border-radius:100px;\n  }\n  .sort-wrap select{\n    background:transparent;border:none;outline:none;\n    font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);\n    padding:11px 16px 11px 36px;cursor:pointer;\n    -webkit-appearance:none;appearance:none;\n  }\n  .sort-wrap::after{\n    content:\"\";position:absolute;left:14px;top:50%;width:8px;height:8px;\n    border-right:1.6px solid var(--ink);border-bottom:1.6px solid var(--ink);\n    transform:translateY(-70%) rotate(45deg);pointer-events:none;\n  }\n\n  /* chip rail (active filters) */\n  .chip-rail{\n    display:flex;align-items:center;gap:8px;flex-wrap:wrap;\n    margin-top:16px;font-size:12px;\n  }\n  .chip-rail .label{color:var(--stone);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:11px}\n  .chip-rail .chip{\n    display:inline-flex;align-items:center;gap:6px;\n    background:var(--white);border:1px solid var(--line);\n    border-radius:100px;padding:5px 8px 5px 12px;\n    font-size:12px;font-weight:500;color:var(--ink);\n  }\n  .chip-rail .chip .x{\n    width:16px;height:16px;border-radius:50%;background:var(--ink);color:var(--white);\n    display:inline-flex;align-items:center;justify-content:center;font-size:9px;\n    cursor:pointer;\n  }\n  .chip-rail .clear{\n    font-size:12px;font-weight:600;color:var(--orange);text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-right:4px;\n  }\n\n  /* result count + view toggle */\n  .results-bar{\n    display:flex;align-items:center;justify-content:space-between;\n    margin:24px 0 20px;gap:24px;\n  }\n  .results-bar .count-line{\n    font-size:14px;color:var(--stone);\n  }\n  .results-bar .count-line strong{color:var(--ink);font-weight:700}\n  .view-toggle{\n    background:var(--cream-2);border:1px solid var(--line);border-radius:100px;\n    padding:4px;display:inline-flex;gap:2px;\n  }\n  .view-toggle button{\n    padding:7px 14px;border-radius:100px;background:transparent;\n    font-size:12px;font-weight:600;color:var(--stone);\n    display:inline-flex;align-items:center;gap:6px;\n  }\n  .view-toggle button.on{background:var(--ink);color:var(--cream)}\n  .view-toggle button svg{width:13px;height:13px}\n\n  /* ============ TENDER LIST ============ */\n  .tender-list{display:flex;flex-direction:column;gap:12px}\n\n  .tcard{\n    display:grid;grid-template-columns:170px 1fr 220px;\n    background:var(--white);border:1px solid var(--line);border-radius:20px;\n    overflow:hidden;transition:transform .25s, box-shadow .25s, border-color .25s;\n    cursor:pointer;\n  }\n  .tcard:hover{\n    transform:translateY(-2px);\n    box-shadow:0 24px 48px -28px rgba(11,9,7,.16);\n    border-color:rgba(254,60,1,.25);\n  }\n  .tcard:hover .tcard-title{color:var(--orange)}\n\n  /* Countdown column */\n  .tcard-countdown{\n    background:linear-gradient(180deg, var(--peach-light) 0%, var(--peach) 100%);\n    padding:22px 14px;border-left:1px solid rgba(254,60,1,.08);\n    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;\n    position:relative;\n  }\n  .ring{position:relative;width:108px;height:108px}\n  .ring svg{transform:rotate(-90deg);display:block}\n  .ring-track{stroke:rgba(11,9,7,.08);fill:none;stroke-width:5}\n  .ring-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .6s ease}\n  .ring-center{\n    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\n  }\n  .ring-center .num{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--ink)}\n  .ring-center .unit{font-size:10px;font-weight:700;letter-spacing:.04em;color:var(--stone);margin-top:4px}\n  .tcard-countdown .deadline{font-size:11px;font-weight:600;color:var(--ink);text-align:center;letter-spacing:-.005em;line-height:1.35}\n  .tcard-countdown .deadline em{font-style:normal;display:block;font-size:9px;color:var(--stone);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}\n\n  /* Variants */\n  .tcard.warn .ring-fill{stroke:var(--amber)}\n  .tcard.warn .ring-center .num{color:var(--amber)}\n  .tcard.fresh .ring-fill{stroke:var(--orange)}\n  .tcard.fresh .ring-center .num{color:var(--orange)}\n  .tcard.expired{opacity:.7}\n  .tcard.expired .ring-fill{stroke:var(--stone-soft)}\n  .tcard.expired .ring-center .num{color:var(--stone)}\n  .tcard.expired .deadline em{color:var(--red)}\n  .tcard.expired .deadline strong{color:var(--red)}\n\n  /* Info column */\n  .tcard-body{padding:22px 24px;display:flex;flex-direction:column;gap:10px;min-width:0;justify-content:center}\n  .tcard-meta-top{display:flex;align-items:center;justify-content:space-between;gap:12px}\n  .tcard-meta-top .left{display:inline-flex;align-items:center;gap:10px;color:var(--stone);font-size:11px;font-weight:500}\n  .tcard-meta-top .left .ref{\n    font-family:'JetBrains Mono',monospace;font-weight:500;color:var(--stone);font-size:11px;letter-spacing:-.01em;\n  }\n  .tcard-meta-top .left .dot{width:3px;height:3px;border-radius:50%;background:var(--stone-soft)}\n\n  .type-tag{\n    display:inline-flex;align-items:center;gap:6px;\n    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;\n    padding:4px 9px 4px 8px;border-radius:100px;\n    background:var(--ink);color:var(--cream);\n  }\n  .type-tag .d{width:5px;height:5px;border-radius:50%;background:var(--orange)}\n  .type-tag.open{background:var(--orange);color:var(--white)}\n  .type-tag.open .d{background:var(--white)}\n  .type-tag.direct{background:var(--ink);color:var(--cream)}\n  .type-tag.framework{background:var(--white);color:var(--ink);border:1px solid var(--ink)}\n  .type-tag.framework .d{background:var(--ink)}\n\n  .tcard-title{\n    font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25;color:var(--ink);\n    transition:color .2s;\n    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;\n    text-wrap:pretty;\n  }\n  .tcard-buyer{\n    display:inline-flex;align-items:center;gap:10px;color:var(--stone);font-size:13px;font-weight:500;flex-wrap:wrap;\n  }\n  .tcard-buyer .buyer{display:inline-flex;align-items:center;gap:7px;color:var(--ink);font-weight:500}\n  .tcard-buyer .avatar{\n    width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--white);\n    display:inline-flex;align-items:center;justify-content:center;\n    font-size:9px;font-weight:700;flex-shrink:0;\n  }\n  .tcard-buyer .avatar.o{background:var(--orange)}\n  .tcard-buyer .avatar.b{background:var(--blue)}\n  .tcard-buyer .avatar.y{background:var(--yellow);color:var(--ink)}\n  .tcard-buyer .verified{\n    display:inline-flex;align-items:center;justify-content:center;\n    width:12px;height:12px;border-radius:50%;background:var(--green);color:var(--white);\n    font-size:8px;font-weight:800;margin-right:-2px;\n  }\n  .tcard-buyer .dot{width:3px;height:3px;border-radius:50%;background:var(--stone-soft)}\n  .tcard-buyer .loc{display:inline-flex;align-items:center;gap:5px}\n  .tcard-buyer .loc svg{width:11px;height:11px}\n  .tcard-buyer .cat{display:inline-flex;align-items:center;gap:5px;color:var(--ink);font-weight:500}\n  .tcard-buyer .cat svg{width:11px;height:11px;color:var(--orange)}\n\n  .tcard-tags{display:none}\n\n  /* Side column — facts grid */\n  .tcard-facts{\n    border-right:1px solid var(--line);background:var(--cream-2);\n    padding:20px 22px;display:flex;flex-direction:column;gap:14px;justify-content:center;\n  }\n  .tcard-facts .facts-row{display:flex;gap:18px}\n  .fact{display:flex;flex-direction:column;gap:4px;min-width:0}\n  .fact .k{font-size:10px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.08em}\n  .fact .v{font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.015em;line-height:1.1}\n  .fact .v.free{color:var(--green)}\n  .fact .v.warn{color:var(--amber)}\n  .fact .v.expired{color:var(--red)}\n  .fact .v.sar{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:14px}\n  .fact .v .sar-u{font-size:10px;color:var(--stone);font-weight:600;margin-right:3px}\n  .size-chip{\n    display:inline-flex;align-items:center;gap:7px;\n    font-size:12px;font-weight:600;color:var(--ink);\n    background:var(--white);border:1px solid var(--line);\n    border-radius:100px;padding:4px 11px 4px 9px;width:fit-content;\n  }\n  .size-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--stone-soft);flex-shrink:0}\n  .size-chip.small .dot{background:var(--blue)}\n  .size-chip.mid .dot{background:var(--orange)}\n  .size-chip.large .dot{background:var(--ink)}\n  .tcard-cta{\n    display:inline-flex;align-items:center;justify-content:space-between;gap:8px;\n    background:var(--ink);color:var(--cream);padding:10px 16px;border-radius:100px;\n    font-size:12px;font-weight:600;\n    transition:background .2s;\n  }\n  .tcard:hover .tcard-cta{background:var(--orange)}\n  .tcard-cta .arrow{display:inline-block;transition:transform .2s}\n  .tcard:hover .tcard-cta .arrow{transform:translateX(-3px)}\n  .tcard.expired .tcard-cta{background:var(--stone)}\n  .tcard.expired:hover .tcard-cta{background:var(--ink)}\n\n  /* ============ PAGINATION ============ */\n  .pagination{display:flex;justify-content:center;gap:6px;margin-top:36px}\n  .pagination button{\n    width:38px;height:38px;border-radius:100px;background:transparent;\n    font-size:13px;font-weight:600;color:var(--ink);\n    display:inline-flex;align-items:center;justify-content:center;\n    transition:background .2s;\n  }\n  .pagination button:hover{background:var(--white)}\n  .pagination button.active{background:var(--ink);color:var(--cream)}\n  .pagination button.disabled{color:var(--stone-soft);cursor:not-allowed}\n  .pagination .nav{background:var(--white);border:1px solid var(--line)}\n  .pagination .gap{color:var(--stone)}\n\n  /* ============ CTA STRIP ============ */\n  .cta-strip{\n    background:linear-gradient(135deg, var(--orange) 0%, #FF6535 100%);\n    color:white;border-radius:32px;padding:56px 56px;margin:64px 0 0;\n    display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center;\n    position:relative;overflow:hidden;\n  }\n  .cta-strip .bg-dots{position:absolute;inset:0;background-image:radial-gradient(circle at center, rgba(255,255,255,.15) 1.5px, transparent 2px);background-size:24px 24px;opacity:.5}\n  .cta-strip h2{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;position:relative;z-index:1}\n  .cta-strip .right{position:relative;z-index:1}\n  .cta-strip p{font-size:15px;line-height:1.55;opacity:.95;margin-bottom:24px;max-width:36ch}\n  .cta-strip .btns{display:flex;gap:10px;flex-wrap:wrap}\n  .cta-strip .btn-white{background:white;color:var(--orange);padding:14px 22px;font-size:14px;font-weight:600;border-radius:100px}\n  .cta-strip .btn-dark{background:var(--ink);color:white;padding:14px 22px;font-size:14px;font-weight:600;border-radius:100px;display:inline-flex;align-items:center;gap:8px}\n\n  /* ============ FOOTER ============ */\n  footer{padding:64px 0 48px}\n  .footer-row{\n    display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:40px;\n    padding-bottom:40px;border-bottom:1px solid var(--line);\n  }\n  .footer-row .brand .logo-wrap{margin-bottom:16px}\n  .footer-row .brand p{font-size:14px;color:var(--stone);line-height:1.55;max-width:36ch}\n  .footer-row h5{font-size:11px;font-weight:700;color:var(--ink);letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px}\n  .footer-row a{display:block;font-size:14px;color:var(--stone);padding:5px 0;transition:color .2s}\n  .footer-row a:hover{color:var(--orange)}\n  .footer-bot{display:flex;justify-content:space-between;align-items:center;padding-top:28px;font-size:13px;color:var(--stone);gap:24px}\n<\u002Fstyle>\n<\u002Fhead>\n<body style=\"\">\n\n<div class=\"page\">\n\n  <!-- ============ TOPBAR ============ -->\n  <div class=\"topbar\">\n    <a href=\"Bid Homepage v3 AR.html\" class=\"logo-wrap\" aria-label=\"Bid\">\n      <img class=\"logo-mini\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABE4AAAKMCAYAAAD1zP0JAAAMP2lDQ1BJQ0MgUHJvZmlsZQAASImVVwdYU8kWnluSkEBooUsJvQkiUgJICaEFkF4EUQlJgFBCDAQRe1lUcO1iARu6KqLYaRYUsbMoNuyLBQVlXSzYlTcpoOu+8r3zfXPvf/85858z584tA4DaSY5IlIOqA5ArLBDHBPvTxycl00nPAQJIgAoMgBGHmy9iRkWFA2hD57/bu5vQG9o1B6nWP/v/q2nw+PlcAJAoiNN4+dxciA8DgFdyReICAIhS
