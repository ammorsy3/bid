<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Light unless the app's own dark theme is on (index.css switches it with
         .dark). Without this, Samsung Internet and Chrome's "force dark" repaint
         light pages themselves. -->
    <meta name="color-scheme" content="only light" />
    <title>Bid</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    />
    <script>
      // Apply theme and language direction before React mounts, so the first
      // paint is already right: no light/dark flash, and Arabic starts
      // right-to-left instead of jumping over once the app loads.
      (function () {
        try {
          var root = document.documentElement;
          var lang = localStorage.getItem('language') === 'ar' ? 'ar' : 'en';
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';

          // Sign-in and onboarding screens are light-only (useForceLightMode);
          // don't paint them dark first on dark-mode phones.
          var lightOnly = /^\/(login|signup|reset-password|verify-email|onboarding|sso-callback|auth\/clerk-callback)(\/|$)/.test(location.pathname);
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved !== 'light' && saved !== 'dark' && prefersDark);
          if (saved === 'system' && prefersDark) isDark = true;
          if (isDark && !lightOnly) root.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
