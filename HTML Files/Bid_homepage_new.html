  <script>

document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ne-soft:#C9C1B6;\n    --white:#FFFFFF;\n    --yellow:#FFC42A;\n    --blue:#4A8FE7;\n    --green:#22C55E;\n    --line:rgba(11,9,7,.08);\n    --line-strong:rgba(11,9,7,.16);\n  }\n  *{box-sizing:border-box;margin:0;padding:0}\n  html,body{background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased}\n  body{overflow-x:hidden}\n  a{color:inherit;text-decoration:none}\n  button{font-family:inherit;cursor:pointer;border:none}\n\n  .page{max-width:1440px;margin:0 auto;padding:0 56px}\n\n  /* ============ TOPBAR ============ */\n  .topbar{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:20px 0;position:sticky;top:0;background:var(--cream);z-index:50;\n    border-bottom:1px solid var(--line);\n  }\n  .logo-mini{height:28px;width:auto;display:block}\n  .topbar nav{display:flex;gap:28px}\n  .topbar nav a{font-size:14px;font-weight:500;color:var(--ink);opacity:.7;transition:opacity .2s}\n  .topbar nav a:hover{opacity:1;color:var(--orange)}\n  .topbar .right{display:flex;gap:10px;align-items:center}\n  .btn{\n    display:inline-flex;align-items:center;gap:8px;\n    padding:11px 18px;font-size:13px;font-weight:500;border-radius:100px;\n    transition:all .2s;letter-spacing:-.005em;\n  }\n  .btn-ghost{background:transparent;color:var(--ink)}\n  .btn-ghost:hover{background:var(--white)}\n  .btn-primary{background:var(--ink);color:var(--cream)}\n  .btn-primary:hover{background:var(--orange)}\n  .btn-primary .arrow{display:inline-block;transition:transform .2s}\n  .btn-primary:hover .arrow{transform:translateX(3px)}\n  .btn-orange{background:var(--orange);color:var(--white)}\n  .btn-orange:hover{background:var(--ink)}\n\n  /* ============ HERO ============ */\n  .hero{padding:80px 0 100px;text-align:center;position:relative}\n  .hero .badge{\n    display:inline-flex;align-items:center;gap:10px;\n    padding:7px 16px 7px 12px;background:var(--white);border:1px solid var(--line);\n    border-radius:100px;font-size:13px;font-weight:500;margin-bottom:32px;\n  }\n  .hero .badge .d{width:7px;height:7px;border-radius:50%;background:var(--orange);animation:pulse 2s ease-out infinite}\n  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(254,60,1,.5)}70%{box-shadow:0 0 0 8px rgba(254,60,1,0)}100%{box-shadow:0 0 0 0 rgba(254,60,1,0)}}\n\n  .hero h1{\n    font-family:'Inter',sans-serif;\n    font-size:clamp(72px,8.4vw,128px);\n    font-weight:700;letter-spacing:-.045em;line-height:.95;color:var(--ink);\n    max-width:14ch;margin:0 auto 28px;\n  }\n  .hero h1 .o{color:var(--orange);position:relative;display:inline-block}\n  .hero h1 .o::after{\n    content:'';position:absolute;right:-.12em;top:-.05em;width:.14em;height:.14em;border-radius:50%;background:var(--ink);\n  }\n  .hero .sub{\n    font-size:18px;color:var(--stone);max-width:54ch;margin:0 auto 36px;line-height:1.5;font-weight:400;\n  }\n  .hero .ctas{display:flex;gap:12px;justify-content:center}\n  .hero .ctas .btn{padding:14px 22px;font-size:14px}\n\n  /* Decorative scattered icons in hero */\n  .hero-deco{position:absolute;inset:0;pointer-events:none}\n  .hero-deco .piece{position:absolute;animation:float 6s ease-in-out infinite}\n  @keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-10px) rotate(var(--r,0deg))}}\n\n  /* Hero partner mark (bottom-left) */\n  .hero-partner{\n    position:absolute;left:0;bottom:24px;\n    display:block;z-index:2;\n  }\n  .hero-partner img{height:72px;width:auto;display:block}\n\n  /* ============ HERO PRODUCT VISUAL ============ */\n  .hero-visual{\n    margin-top:80px;background:linear-gradient(180deg,var(--peach-light) 0%, var(--peach) 100%);\n    border-radius:32px;padding:64px 48px 0;position:relative;overflow:hidden;\n    border:1px solid rgba(254,60,1,.08);\n  }\n  .hero-visual .frame-strip{\n    display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;align-items:end;\n  }\n\n  /* ============ SECTION ============ */\n  section{padding:80px 0;position:relative}\n  .sec-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px;gap:48px}\n  .sec-head .num{\n    font-size:13px;font-weight:600;color:var(--orange);\n    background:var(--orange-soft);padding:6px 14px;border-radius:100px;\n    display:inline-block;margin-bottom:18px;\n  }\n  .sec-head h2{\n    font-size:clamp(48px,5.4vw,80px);font-weight:700;letter-spacing:-.035em;line-height:.95;\n    color:var(--ink);\n  }\n  .sec-head h2 .dot-end{color:var(--orange)}\n  .sec-head .summary{font-size:14px;color:var(--stone);max-width:30ch;line-height:1.5;text-align:right}\n\n  /* ============ STAGES (compact) ============ */\n  .stages{display:grid;gap:20px;position:relative}\n  .stages.s3{grid-template-columns:1fr 1fr 1fr}\n  .stages.s4{grid-template-columns:1fr 1fr 1fr 1fr}\n\n  .stage{\n    background:linear-gradient(180deg, var(--peach-light) 0%, var(--peach) 100%);\n    border-radius:24px;padding:28px 24px 32px;\n    border:1px solid rgba(254,60,1,.08);\n    position:relative;overflow:hidden;\n    display:flex;flex-direction:column;gap:8px;\n    min-height:340px;\n    transition:transform .3s, box-shadow .3s;\n  }\n  .stage:hover{transform:translateY(-3px);box-shadow:0 24px 48px -24px rgba(254,60,1,.18)}\n\n  .stage .visual{\n    position:relative;height:210px;\n    background:transparent;\n    display:flex;align-items:center;justify-content:center;\n  }\n  .stage .footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}\n  .stage h3{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.05;color:var(--ink);flex:1}\n  .stage .arrow-pill{\n    width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--white);\n    display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;\n    transition:background .2s;\n  }\n  .stage:hover .arrow-pill{background:var(--orange)}\n\n  /* scattered icon chips inside the visual */\n  .ico{\n    position:absolute;display:inline-flex;align-items:center;gap:6px;\n    background:var(--white);border-radius:100px;padding:5px 11px 5px 7px;\n    font-size:11px;font-weight:600;color:var(--ink);\n    box-shadow:0 6px 14px -6px rgba(11,9,7,.18);\n    white-space:nowrap;\n    animation:bob 5s ease-in-out infinite;\n  }\n  .ico .dot{width:14px;height:14px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--white);font-size:9px;font-weight:700}\n  .ico.solid{background:var(--ink);color:var(--white)}\n  .ico.orange{background:var(--orange);color:var(--white)}\n  @keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0))}50%{transform:translateY(-4px) rotate(var(--r,0))}}\n\n  /* ============ INNER MOCKUPS ============ */\n  /* Brief card (Stage 1 RFP) */\n  .mock-brief{\n    background:var(--white);border-radius:14px;padding:14px;\n    width:88%;box-shadow:0 8px 20px -8px rgba(11,9,7,.12);\n    display:flex;flex-direction:column;gap:8px;\n    position:relative;\n  }\n  .mock-brief .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}\n  .mock-brief .title-bar{height:9px;width:50%;background:var(--ink);border-radius:3px}\n  .mock-brief .badge{background:var(--orange);color:white;font-size:10px;font-weight:700;padding:4px 8px;border-radius:5px;letter-spacing:.02em}\n  .mock-brief .line{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--peach) 0%,var(--peach-deep) 50%,var(--peach-light) 100%)}\n  .mock-brief .line.w70{width:70%}\n  .mock-brief .line.w55{width:55%}\n  .mock-brief .line.w40{width:40%}\n  .mock-brief .bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px}\n  .mock-brief .bottom .gray{height:6px;width:30%;background:#E5E0D8;border-radius:3px}\n  .mock-brief .btn-mini{font-size:11px;background:var(--orange);color:white;padding:5px 12px;border-radius:6px;font-weight:600}\n  .mock-brief .sparkle{\n    position:absolute;right:-22px;top:14px;width:30px;height:30px;\n    display:flex;align-items:center;justify-content:center;\n  }\n  .mock-brief .sparkle svg{width:100%;height:100%;color:var(--orange)}\n\n  /* Invite stack (Stage 2 RFP) */\n  .mock-invite{\n    display:flex;flex-direction:column;gap:12px;align-items:center;width:90%;\n  }\n  .mock-invite .avatars{display:flex;gap:-4px}\n  .mock-invite .av{\n    width:42px;height:42px;border-radius:50%;border:2px solid var(--peach-light);\n    display:flex;align-items:center;justify-content:center;margin-left:-6px;\n    box-shadow:0 4px 10px -4px rgba(11,9,7,.18);\n    color:white;\n  }\n  .mock-invite .av:first-child{margin-left:0}\n  .mock-invite .av svg{width:18px;height:18px}\n  .mock-invite .av.o{background:var(--orange)}\n  .mock-invite .av.y{background:var(--yellow);color:var(--ink)}\n  .mock-invite .av.b{background:var(--blue)}\n  .mock-invite .av.plus{\n    background:transparent;border:1.5px dashed var(--orange);color:var(--orange);\n    font-size:18px;font-weight:600;\n  }\n  .mock-invite .link-pill{\n    background:var(--white);border-radius:100px;padding:8px 14px;\n    display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink);\n    box-shadow:0 6px 14px -6px rgba(11,9,7,.16);\n    font-weight:500;\n  }\n  .mock-invite .link-pill svg{width:12px;height:12px;color:var(--orange)}\n\n  /* Proposals stack (Stage 3 RFP) */\n  .mock-proposals{\n    position:relative;width:80%;display:flex;flex-direction:column;gap:6px;\n  }\n  .mock-proposals .pcard{\n    background:var(--white);border-radius:10px;padding:10px 12px;\n    display:flex;justify-content:space-between;align-items:center;\n    box-shadow:0 4px 10px -4px rgba(11,9,7,.1);\n    transform:rotate(var(--r,0deg));\n  }\n  .mock-proposals .pcard .l{display:flex;align-items:center;gap:8px}\n  .mock-proposals .pcard .av-mini{width:20px;height:20px;border-radius:50%;flex-shrink:0}\n  .mock-proposals .pcard .name{height:6px;width:60px;background:var(--ink);border-radius:3px}\n  .mock-proposals .pcard .price{font-size:11px;font-weight:700;color:var(--orange)}\n  .mock-proposals .pcard.a{--r:-2deg;margin-left:8px}\n  .mock-proposals .pcard.b{--r:1deg}\n  .mock-proposals .pcard.c{--r:-1deg;margin-left:14px}\n\n  /* Marketplace stage mockups */\n  .mock-rfpform{\n    background:var(--white);border-radius:14px;padding:14px;width:88%;\n    box-shadow:0 8px 20px -8px rgba(11,9,7,.12);\n    display:flex;flex-direction:column;gap:8px;\n  }\n  .mock-rfpform .row{display:flex;justify-content:space-between;align-items:center;gap:8px}\n  .mock-rfpform .label-tab{font-size:9px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.06em}\n  .mock-rfpform .toggle{display:inline-flex;gap:3px}\n  .mock-rfpform .toggle .t{width:18px;height:6px;border-radius:3px;background:#E5E0D8}\n  .mock-rfpform .toggle .t.on{background:var(--orange)}\n  .mock-rfpform .slider{height:6px;background:#E5E0D8;border-radius:3px;position:relative}\n  .mock-rfpform .slider span{position:absolute;left:0;top:0;height:100%;width:65%;background:var(--orange);border-radius:3px}\n  .mock-rfpform .slider em{position:absolute;left:65%;top:-3px;width:12px;height:12px;background:white;border:2px solid var(--orange);border-radius:50%}\n  .mock-rfpform .line{height:5px;border-radius:3px;background:#EFE9DE}\n\n  .mock-po{\n    background:var(--white);border-radius:14px;padding:16px;width:80%;\n    box-shadow:0 8px 20px -8px rgba(11,9,7,.12);position:relative;\n    display:flex;flex-direction:column;gap:8px;\n  }\n  .mock-po .head{display:flex;justify-content:space-between;align-items:flex-start}\n  .mock-po .head .l{font-size:10px;font-weight:600;color:var(--stone);letter-spacing:.06em}\n  .mock-po .amount{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:-.02em}\n  .mock-po .lines{display:flex;flex-direction:column;gap:4px;margin-top:4px}\n  .mock-po .lines .l{height:5px;border-radius:3px;background:#EFE9DE}\n  .mock-po .stamp{\n    position:absolute;right:-12px;top:-12px;width:54px;height:54px;border-radius:50%;\n    background:var(--orange);color:white;display:flex;align-items:center;justify-content:center;\n    font-size:9px;font-weight:700;text-align:center;line-height:1.05;letter-spacing:.04em;\n    text-transform:uppercase;transform:rotate(-12deg);\n    box-shadow:0 6px 14px -4px rgba(254,60,1,.4);\n  }\n\n  .mock-feed{\n    width:90%;display:grid;grid-template-columns:1fr 1fr;gap:6px;\n  }\n  .mock-feed .item{\n    background:var(--white);border-radius:8px;padding:8px;\n    box-shadow:0 4px 10px -4px rgba(11,9,7,.1);\n    display:flex;flex-direction:column;gap:4px;\n  }\n  .mock-feed .item .swatch{width:100%;height:24px;border-radius:4px}\n  .mock-feed .item:nth-child(1) .swatch{background:var(--orange)}\n  .mock-feed .item:nth-child(2) .swatch{background:var(--ink)}\n  .mock-feed .item:nth-child(3) .swatch{background:var(--yellow)}\n  .mock-feed .item:nth-child(4) .swatch{background:var(--blue)}\n  .mock-feed .item .l{height:4px;background:#EFE9DE;border-radius:2px}\n  .mock-feed .item .l.short{width:60%}\n\n  .mock-rank{\n    width:88%;display:flex;flex-direction:column;gap:5px;\n  }\n  .mock-rank .row{\n    background:var(--white);border-radius:8px;padding:8px 10px;\n    display:flex;align-items:center;gap:10px;\n    box-shadow:0 4px 10px -4px rgba(11,9,7,.08);\n  }\n  .mock-rank .row .rk{font-size:11px;font-weight:700;color:var(--orange);width:14px}\n  .mock-rank .row .av{width:18px;height:18px;border-radius:50%}\n  .mock-rank .row .av.o{background:var(--orange)}\n  .mock-rank .row .av.b{background:var(--blue)}\n  .mock-rank .row .av.y{background:var(--yellow)}\n  .mock-rank .row .av.i{background:var(--ink)}\n  .mock-rank .row .nm{height:5px;flex:1;background:#EFE9DE;border-radius:3px}\n  .mock-rank .row .pct{font-size:10px;font-weight:600;color:var(--orange)}\n  .mock-rank .row.top{background:linear-gradient(90deg,var(--orange) 0%, #FF6535 100%);color:white}\n  .mock-rank .row.top .rk{color:white}\n  .mock-rank .row.top .nm{background:rgba(255,255,255,.4)}\n  .mock-rank .row.top .pct{color:white}\n\n  /* Traction stages */\n  .mock-tlink{\n    background:var(--white);border-radius:14px;padding:14px;width:86%;\n    box-shadow:0 8px 20px -8px rgba(11,9,7,.12);\n    display:flex;flex-direction:column;gap:10px;\n  }\n  .mock-tlink .url-pill{\n    background:var(--peach-light);border:1px solid rgba(254,60,1,.15);\n    border-radius:100px;padding:7px 14px;display:flex;align-items:center;gap:8px;\n    font-size:11px;font-weight:600;color:var(--ink);\n  }\n  .mock-tlink .url-pill svg{width:11px;height:11px;color:var(--orange);flex-shrink:0}\n  .mock-tlink .url-pill .copy{margin-left:auto;font-size:9px;background:var(--ink);color:white;padding:2px 7px;border-radius:4px;letter-spacing:.04em}\n  .mock-tlink .row-mini{display:flex;justify-content:space-between;align-items:center}\n  .mock-tlink .row-mini .label{font-size:9px;color:var(--stone);font-weight:600;letter-spacing:.06em;text-transform:uppercase}\n  .mock-tlink .row-mini .stat{font-size:14px;font-weight:700;color:var(--orange)}\n\n  .mock-grow{\n    width:90%;display:flex;flex-direction:column;align-items:center;gap:8px;\n  }\n  .mock-grow .ring{display:flex;align-items:center;gap:-6px}\n  .mock-grow .av{\n    width:32px;height:32px;border-radius:50%;border:2px solid var(--peach-light);\n    margin-left:-6px;display:flex;align-items:center;justify-content:center;color:white;\n  }\n  .mock-grow .av:first-child{margin-left:0}\n  .mock-grow .av svg{width:14px;height:14px}\n  .mock-grow .row-a .av:nth-child(1){background:var(--orange)}\n  .mock-grow .row-a .av:nth-child(2){background:var(--blue)}\n  .mock-grow .row-a .av:nth-child(3){background:var(--yellow);color:var(--ink)}\n  .mock-grow .row-b .av:nth-child(1){background:var(--ink)}\n  .mock-grow .row-b .av:nth-child(2){background:var(--green)}\n  .mock-grow .row-b .av:nth-child(3){background:var(--orange)}\n  .mock-grow .row-b .av:nth-child(4){background:var(--blue)}\n  .mock-grow .row-b .av:nth-child(5){background:var(--yellow);color:var(--ink)}\n  .mock-grow .badge-pill{\n    background:var(--white);border-radius:100px;padding:5px 11px;font-size:11px;font-weight:600;\n    box-shadow:0 4px 10px -4px rgba(11,9,7,.12);display:inline-flex;align-items:center;gap:6px;\n  }\n  .mock-grow .badge-pill .d{width:6px;height:6px;border-radius:50%;background:var(--green)}\n\n  .mock-rfpcheck{\n    background:var(--white);border-radius:14px;padding:14px;width:84%;\n    box-shadow:0 8px 20px -8px rgba(11,9,7,.12);\n    display:flex;flex-direction:column;gap:8px;\n  }\n  .mock-rfpcheck .head{font-size:11px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.06em}\n  .mock-rfpcheck .check-row{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:500}\n  .mock-rfpcheck .cb{\n    width:14px;height:14px;border-radius:4px;flex-shrink:0;\n    display:flex;align-items:center;justify-content:center;color:white;font-size:9px;font-weight:700;\n  }\n  .mock-rfpcheck .cb.on{background:var(--orange)}\n  .mock-rfpcheck .cb.off{background:transparent;border:1.5px solid #DDD5C8}\n  .mock-rfpcheck .nm{height:6px;flex:1;background:#EFE9DE;border-radius:3px}\n  .mock-rfpcheck .nm.dark{background:var(--ink)}\n\n  /* ============ TAKEAWAY ============ */\n  .takeaway{\n    margin-top:36px;padding:24px 28px;background:var(--white);border-radius:18px;\n    display:flex;justify-content:space-between;align-items:center;gap:32px;\n    border:1px solid var(--line);\n  }\n  .takeaway .quote{\n    font-size:20px;font-weight:500;letter-spacing:-.015em;color:var(--ink);max-width:60ch;\n  }\n  .takeaway .quote .accent{color:var(--orange);font-weight:600}\n  .takeaway .stat{\n    text-align:right;flex-shrink:0;\n  }\n  .takeaway .stat .v{font-size:24px;font-weight:700;color:var(--orange);letter-spacing:-.02em;line-height:1}\n  .takeaway .stat .k{font-size:11px;font-weight:600;color:var(--stone);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}\n\n  /* ============ FOR VENDORS ============ */\n  .vendors-section{padding:80px 0}\n  .vendors-hero{\n    background:var(--ink);color:var(--cream);border-radius:32px;padding:64px 56px;\n    display:flex;flex-direction:column;align-items:flex-start;gap:12px;\n    margin-bottom:32px;position:relative;overflow:hidden;\n  }\n  .vendors-hero .bg-dots{position:absolute;inset:0;background-image:radial-gradient(circle at center, rgba(254,60,1,.18) 1.5px, transparent 2px);background-size:28px 28px;opacity:.5}\n  .vendors-hero h2{position:relative;z-index:1;font-size:clamp(96px,11vw,180px);font-weight:700;letter-spacing:-.045em;line-height:.88;color:var(--cream)}\n  .vendors-hero h2 .dot-end{color:var(--orange)}\n\n  .vendor-cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}\n  .vcard{\n    background:linear-gradient(180deg, var(--peach-light) 0%, var(--peach) 100%);\n    border-radius:24px;padding:28px;border:1px solid rgba(254,60,1,.08);\n    display:flex;flex-direction:column;gap:14px;min-height:420px;\n    transition:transform .3s;\n  }\n  .vcard:hover{transform:translateY(-3px)}\n  .vcard .visual{height:170px;position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:8px}\n  .vcard h3{font-size:24px;font-weight:700;letter-spacing:-.025em;line-height:1.1;color:var(--ink)}\n  .vcard p{font-size:14px;color:var(--stone);line-height:1.55}\n\n  /* Vendor card mini visuals */\n  .mock-vbrief{\n    background:var(--white);border-radius:12px;padding:12px;width:80%;\n    box-shadow:0 8px 20px -8px rgba(11,9,7,.14);\n    display:flex;flex-direction:column;gap:6px;position:relative;\n  }\n  .mock-vbrief .head{display:flex;justify-content:space-between;align-items:center}\n  .mock-vbrief .badge{background:var(--orange);color:white;font-size:9px;font-weight:700;padding:3px 7px;border-radius:4px}\n  .mock-vbrief .l{height:5px;background:#EFE9DE;border-radius:3px}\n  .mock-vbrief .l.w70{width:70%}\n  .mock-vbrief .l.w50{width:50%}\
